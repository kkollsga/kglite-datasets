[package]
# PyO3 wrapper crate. Built by maturin into the `kglite-datasets` wheel.
# The engine-free loaders live in the sibling `kglite-datasets` crate;
# this crate exposes them to Python (mirrors kglite's polars-style
# `kglite` core + `kglite-py` wrapper split).
name = "kglite-datasets-py"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "PyO3 wrapper for kglite-datasets — Python bindings around the SEC / Sodir / Wikidata loaders."
# NOT for crates.io — this crate is the source for the Python wheel
# (built by maturin → `pip install kglite-datasets`). Rust embedders
# depend on the sibling `kglite-datasets` crate directly.
publish = false

[features]
# `abi3` (single cdylib for Python 3.10+) is default-on so `cargo build` /
# `maturin develop` behave normally. `python-extension` toggles pyo3's
# extension-module feature — off for plain `cargo build` (so the rlib is
# reusable and the workspace builds without a libpython link surprise), on
# for the maturin wheel build. Same pattern as kglite-py.
default = ["abi3"]
python-extension = ["pyo3/extension-module"]
abi3 = ["pyo3/abi3-py310"]

[lib]
# `name = kglite_datasets_py` avoids an rlib filename collision with the
# core crate's `libkglite_datasets.rlib`. The wheel's .so name is set by
# `pyproject.toml`'s `[tool.maturin] module-name = "kglite_datasets.kglite_datasets"`.
name = "kglite_datasets_py"
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
pyo3 = { version = "0.29", features = ["chrono"] }
# The engine-free loaders. Graph *building* stays in Python (the wrappers
# call `from kglite import KnowledgeGraph`), so this crate does not link
# the kglite engine — it only exposes fetch/parse/extract.
kglite-datasets = { path = "../kglite-datasets" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
# The wikidata/sec bindings parse/format ISO timestamps directly. Pinned in
# lockstep with kglite (see the Phase 9 dep audit).
chrono = { version = "0.4.43", features = ["serde"] }
