[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "kglite-datasets"
description = "Fetch-build-cache dataset loaders for kglite — SEC EDGAR, Sodir (Norwegian Offshore Directorate), and Wikidata as queryable knowledge graphs."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Kristian dF Kollsgård", email = "kkollsg@gmail.com"}
]
keywords = ["knowledge-graph", "datasets", "sec-edgar", "wikidata", "sodir", "kglite", "cypher"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Database",
    "Topic :: Scientific/Engineering",
]
dynamic = ["version"]

# The single wheel bundles the Rust loaders (this crate) but reuses the
# kglite engine for the graph-build step — the wrappers call
# `from kglite import KnowledgeGraph`. So the wheel depends on kglite at
# runtime; "everything" means all dataset functionality, engine reused not
# forked.
#
# Keep this floor aligned with the supported kglite engine baseline. CI tests
# the exact floor as well as the newest release satisfying the range, so the
# lower bound cannot silently rot.
dependencies = [
    "kglite>=0.16.22",
]

[project.optional-dependencies]
# Columnar export helpers. Kept SOFT (never a hard dep) — the 2026-07
# mimalloc TCB slot-clash entered kglite workflows through SEC + pyarrow;
# isolation from that blast radius is part of why this crate exists.
arrow = ["pyarrow"]

[tool.ruff]
# Deliberately mirrors ../kglite's `[tool.ruff]` — one Python style across the
# ecosystem, so a contributor moving between the two repos never re-learns the
# formatter. Divergences from kglite are only the two path settings below
# (`src` / `known-first-party`), which name this package instead of `kglite`.
line-length = 120
target-version = "py310"
src = ["kglite_datasets"]
# ruff 0.16 began formatting Python code blocks embedded in Markdown; our prose
# examples are hand-wrapped for narrow doc columns. Same scope decision as
# kglite — keep the formatter on real Python only.
extend-exclude = ["*.md"]

[tool.ruff.lint]
# PLW1514 (`open`/`read_text`/`write_text` without an explicit encoding) is
# still a preview rule, so preview is enabled with `explicit-preview-rules`:
# only preview rules named by their exact code are active, and the E/F/I/W
# sets keep their stable behaviour.
preview = true
explicit-preview-rules = true
select = ["E", "F", "I", "W", "PLW1514"]

[tool.ruff.lint.isort]
known-first-party = ["kglite_datasets"]
force-sort-within-sections = true

[tool.ruff.lint.per-file-ignores]
# Tests live inside the package (mixed layout), so the path pattern differs
# from kglite's `tests/*` — the intent (E402: imports after a skip guard or an
# env-var preamble are deliberate) is the same.
"kglite_datasets/**/tests/*" = ["E402"]
"benchmarks/*" = ["E402"]

[tool.pytest.ini_options]
# The loader test suites live inside the package (mixed layout). Live-API
# suites (SEC/Sodir/Wikidata) self-skip unless their integration env var is
# set — e.g. KGLITE_SEC_INTEGRATION=1 — so the default run is fully offline.
testpaths = ["kglite_datasets"]
markers = [
    "live: requires a live network service (SEC EDGAR / Sodir / Wikidata). Opt in with the suite's integration env var; never part of the default run. This is also the suite-accounting contract — see kglite_datasets/conftest.py: a skipped test without it fails the run.",
]
# A mistyped marker must be a collection error, not a silently inert
# decorator. `@pytest.mark.liv` would otherwise leave the test skipped and
# unaccounted — caught by conftest, but at the wrong end of the loop.
addopts = "--strict-markers"

[tool.maturin]
manifest-path = "crates/kglite-datasets-py/Cargo.toml"
# Rename the wheel's extension so the package's `from .kglite_datasets import *`
# finds it (maturin's default would use the crate's `[lib] name`).
module-name = "kglite_datasets.kglite_datasets"
# extension-module is added here (not as a Cargo default) so plain
# `cargo build` / `cargo test` still link. Mirrors kglite.
features = ["python-extension"]
python-source = "."
