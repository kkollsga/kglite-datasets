name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-checks:
    name: Rust checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # The kglite-datasets-py crate is a PyO3 extension (abi3, extension-module
      # off by default), so a plain `cargo build`/`clippy` of the workspace
      # links libpython — provide it.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-checks-${{ matrix.os }}
          workspaces: ". -> target"

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Rust tests
        # Includes tests/csv_golden.rs — the sodir Rust output-boundary golden.
        run: cargo test --workspace

  python-lint:
    # ruff was in the Makefile from day one but never in CI, and was never
    # installed locally either — so the Python lint gate had never executed a
    # single time (42 findings, 11 unformatted files, all green). One
    # OS-independent job, pinned so a ruff release cannot turn an unrelated PR
    # red; bump it deliberately.
    name: Python lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install ruff
        run: python -m pip install 'ruff==0.16.0'

      # Config lives in pyproject.toml `[tool.ruff]`, mirroring ../kglite.
      # Keep the path list in sync with the Makefile's PY_PATHS.
      - name: ruff check
        run: ruff check kglite_datasets benchmarks

      - name: ruff format --check
        run: ruff format --check kglite_datasets benchmarks

  python:
    name: Python (${{ matrix.os }}, kglite ${{ matrix.kglite-label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # Both ends of the declared `kglite>=0.16.13` range. Testing only the
        # latest engine leaves the floor unverified — it would rot silently
        # until a downstream that legitimately resolved an older kglite hit a
        # break we never saw. `0.16.13` ships wheels for both runners.
        kglite-spec: ['kglite>=0.16.13', 'kglite==0.16.13']
        include:
          - kglite-spec: 'kglite>=0.16.13'
            kglite-label: latest
          - kglite-spec: 'kglite==0.16.13'
            kglite-label: floor
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: python-${{ matrix.os }}
          workspaces: ". -> target"

      - name: Create venv and install build + runtime deps
        # `kglite` is the runtime engine dependency (graph build); pulled from
        # PyPI. maturin builds our native extension into the venv. The spec
        # comes from the matrix so both ends of the declared range are covered
        # — keep it consistent with `dependencies` in pyproject.toml.
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install maturin pytest "${{ matrix.kglite-spec }}"

      - name: Report the resolved engine version
        run: .venv/bin/python -c "import kglite; print('kglite', kglite.__version__)"

      - name: Build the extension into the venv (maturin develop)
        run: .venv/bin/maturin develop

      - name: Run the offline Python suite
        # Live-API suites (SEC/Sodir/Wikidata) self-skip without their
        # KGLITE_*_INTEGRATION env vars — the default run is fully offline and
        # includes the SEC goldens plus the per-form parser suite.
        # `kglite_datasets/conftest.py` fails the run on any skip that is not
        # accounted for, so a newly-disabled test cannot ride along green.
        run: .venv/bin/python -m pytest -v --tb=short
